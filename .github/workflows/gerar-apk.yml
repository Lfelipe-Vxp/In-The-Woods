name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: for z in *.zip; do unzip -q -o "$z"; done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar Capacitor
        working-directory: in-the-woods-android
        run: npm run setup

      - name: Criar projeto Android
        working-directory: in-the-woods-android
        run: npm run add-android

      - name: Gerar icones
        working-directory: in-the-woods-android
        run: npm run icons

      - name: Copiar o jogo
        working-directory: in-the-woods-android
        run: npm run sync

      - name: Compilar o APK
        working-directory: in-the-woods-android
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Renomear APK
        run: cp in-the-woods-android/android/app/build/outputs/apk/debug/app-debug.apk In-The-Woods.apk

      - name: Publicar link de download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: In The Woods v1.${{ github.run_number }}
          files: In-The-Woods.apk
          make_latest: true
